name: Development compatibility gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development:
    name: Development compatibility
    runs-on:
      group: c3-private-release
      labels: [self-hosted, Windows, X64, c3-legacy-msbuild]
    environment: c3-development-compatibility
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require the permanent development branch
        shell: powershell
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/dev') {
            throw 'Development compatibility must be dispatched only from refs/heads/dev.'
          }

      - name: Verify repository release contract
        shell: powershell
        run: ./build/validate-release-contract.ps1 -Mode Repository -RequireRemoteBaseline

      - name: Reproduce and verify portable archives
        shell: powershell
        run: ./build/verify-reproducible-packages.ps1
