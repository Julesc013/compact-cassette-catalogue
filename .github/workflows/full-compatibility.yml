name: Full compatibility gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Build, test, inspect, and package both lanes
    runs-on: [self-hosted, Windows, X64, c3-legacy-msbuild]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify both compatibility lanes
        shell: powershell
        run: ./build/verify.ps1 -Rebuild

      - name: Create and verify portable archives
        shell: powershell
        run: ./build/package.ps1 -SkipBuild

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: c3-portable-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
