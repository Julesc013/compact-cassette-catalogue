name: Development compatibility gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development:
    name: Development compatibility
    runs-on: [self-hosted, Windows, X64, c3-legacy-msbuild]
    environment: c3-development-compatibility
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require the permanent development branch
        shell: powershell
        run: |
          $branches = Get-Content ./build/branches.json -Raw | ConvertFrom-Json
          $expectedRef = 'refs/heads/' + $branches.currentGeneration.integration
          if ($env:GITHUB_REF -cne $expectedRef) {
            throw "Development compatibility must be dispatched only from $expectedRef."
          }

      - name: Verify repository release contract
        shell: powershell
        run: ./build/validate-release-contract.ps1 -Mode Repository -RequireRemoteBaseline

      - name: Reproduce and verify portable archives
        shell: powershell
        run: ./build/verify-reproducible-packages.ps1
