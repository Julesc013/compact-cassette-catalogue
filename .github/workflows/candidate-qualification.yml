name: Candidate qualification gate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full 40-character qualification-attestation commit E
        required: true
        type: string
      attestation_ref:
        description: One-use branch attest/<tag>-candidate-<full E SHA>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: c3-release-transaction
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate qualification (E)
    runs-on: [self-hosted, Windows, X64, c3-legacy-msbuild]
    environment: c3-release-qualification
    timeout-minutes: 60

    steps:
      - name: Check out trusted master workflow control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact candidate target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          path: target-repository
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require trusted dispatch control and exact remote E transport
        shell: powershell
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ATTESTATION_REF: ${{ inputs.attestation_ref }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/master') {
            throw 'Candidate qualification must be dispatched from trusted master workflow control.'
          }
          if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Candidate qualification requires a full lowercase 40-character E SHA.'
          }
          $tagPattern = '(?:v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?:alpha|beta|rc)\.[1-9][0-9]*)?|(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:(?:a|b|rc)[1-9][0-9]*)?)'
          $candidatePattern = '^attest/' + $tagPattern + '-candidate-' + [regex]::Escape($env:EXPECTED_COMMIT) + '$'
          if ($env:ATTESTATION_REF -cnotmatch $candidatePattern) {
            throw 'Candidate qualification requires its exact one-use, SHA-bound candidate attestation ref.'
          }
          $trustedHead = (git -C trusted-control rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $trustedHead -cne $env:GITHUB_SHA) {
            throw "Trusted-control checkout is not exact master $($env:GITHUB_SHA)."
          }
          $targetHead = (git -C target-repository rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $targetHead -cne $env:EXPECTED_COMMIT) {
            throw "Target checkout is not exact E $($env:EXPECTED_COMMIT)."
          }
          ./trusted-control/build/validate-trusted-release-target.ps1 `
            -Mode Candidate `
            -TrustedRepository ./trusted-control `
            -TargetRepository ./target-repository `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ExpectedTrustedMasterCommit $env:GITHUB_SHA `
            -AttestationRef $env:ATTESTATION_REF

      - name: Verify repository release contract
        shell: powershell
        working-directory: target-repository
        run: ./build/validate-release-contract.ps1 -Mode Repository -RequireRemoteBaseline

      - name: Reproduce and verify portable archives
        shell: powershell
        working-directory: target-repository
        run: ./build/verify-reproducible-packages.ps1

      - name: Verify exact pre-tag candidate and artifacts
        shell: powershell
        working-directory: target-repository
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: ./build/validate-release-contract.ps1 -Mode Candidate -ExpectedCommit $env:EXPECTED_COMMIT -RequireArtifacts

      - name: Read release channel
        id: release_identity
        shell: powershell
        working-directory: target-repository
        run: |
          $identity = ./build/get-release-identity.ps1
          $line = "channel=$($identity.ReleaseChannel)`n"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, $line, (New-Object Text.UTF8Encoding($false)))

      - name: Retain qualified public-stage packages
        if: steps.release_identity.outputs.channel != 'alpha'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c3-candidate-portable-packages
          path: target-repository/artifacts/packages/
          if-no-files-found: error
          retention-days: 14
