name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Metadata, lifecycle, boundaries, and project parity
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # Checkout the event commit, not refs/tags/<name>. On tag events the
          # latter can rewrite an annotated local tag to its peeled commit.
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify workflow security and tag-checkout contract
        shell: powershell
        run: ./build/validate-workflow-contract.ps1

      - name: Verify canonical release metadata
        shell: powershell
        run: ./build/verify-metadata.ps1

      - name: Test strict JSON validation
        shell: powershell
        run: ./build/test-json-validator.ps1

      - name: Verify permanent branch contract
        shell: powershell
        run: |
          ./build/validate-branch-contract.ps1
          ./build/test-branch-contract.ps1

      - name: Verify resumable release-train state
        shell: powershell
        run: |
          ./build/validate-release-train.ps1
          ./build/test-release-train.ps1

      - name: Verify repository release contract
        shell: powershell
        run: ./build/validate-release-contract.ps1 -Mode Repository -RequireRemoteBaseline

      - name: Test release contract failure paths
        shell: powershell
        run: ./build/test-release-contract.ps1

      - name: Test leased release-reference transactions
        shell: powershell
        run: ./build/test-release-ref-transaction.ps1

      - name: Test trusted release-target bootstrap guard
        shell: powershell
        run: ./build/test-trusted-release-target.ps1

      - name: Test update-feed contract projections
        shell: powershell
        run: ./build/test-update-feed-contract.ps1

      - name: Verify master checkpoint ledger head
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: powershell
        run: ./build/validate-release-contract.ps1 -Mode Master

      - name: Verify qualified v2 release tag
        if: startsWith(github.ref, 'refs/tags/v2.')
        shell: powershell
        run: ./build/validate-release-contract.ps1 -Mode Tag

      - name: Verify deterministic compiler contract
        shell: powershell
        run: ./build/validate-build-contract.ps1

      - name: Verify dependency direction
        shell: powershell
        run: ./build/validate-dependencies.ps1

      - name: Verify WinForms boundaries
        shell: powershell
        run: ./build/validate-ui-boundaries.ps1

      - name: Verify shared WinForms project parity
        shell: powershell
        run: ./build/validate-project-parity.ps1

      - name: Verify local documentation links
        shell: powershell
        run: ./build/validate-docs.ps1

      - name: Test documentation discovery in exported source trees
        shell: powershell
        run: ./build/test-doc-validation.ps1

      - name: Check whitespace
        shell: powershell
        run: |
          git show --check --format= HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git show --check failed.' }
